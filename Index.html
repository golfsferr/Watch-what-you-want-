<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Streaming Finder</title>

  <style>

    body {

      font-family: Arial;

      background: #111;

      color: #fff;

      text-align: center;

      padding: 50px;

    }

    input {

      padding: 10px;

      width: 250px;

      font-size: 16px;

    }

    button {

      padding: 10px 20px;

      font-size: 16px;

      cursor: pointer;

    }

    #results {

      margin-top: 30px;

    }

  </style>

</head>

<body>

  <h1>Streaming Finder</h1>

  <p>Search where a movie is streaming</p>

  <input id="searchBox" placeholder="Enter movie name..." />

  <button onclick="search()">Search</button>

  <div id="results"></div>

  <script>

    function search() {

      const query = document.getElementById("searchBox").value;

      const results = document.getElementById("results");

      if (!query) {

        results.innerHTML = "Please enter a movie name.";

        return;

      }

      results.innerHTML = `

        <h2>${query}</h2>

        <p>Available on:</p>

        <ul>

          <li>Netflix</li>

          <li>Amazon Prime Video</li>

        </ul>

      `;

    }

  </script>

</body>

</html>
