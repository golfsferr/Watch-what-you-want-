<!DOCTYPE html>

<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch What You Want</title>

<style>

body {

margin: 0;

font-family: Arial;

background: #050505;

color: white;

text-align: center;

}

.container {

padding: 40px 20px;

max-width: 1000px;

margin: auto;

}

h1 {

font-size: 50px;

}

input {

padding: 15px;

width: 60%;

max-width: 400px;

border-radius: 30px;

border: none;

font-size: 16px;

}

button {

padding: 15px 25px;

border: none;

border-radius: 30px;

background: #e50914;

color: white;

font-size: 16px;

margin-left: 10px;

cursor: pointer;

}

.grid {

margin-top: 40px;

display: grid;

grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

gap: 20px;

}

.card img {

width: 100%;

border-radius: 10px;

}

.card p {

font-size: 14px;

}

</style>

</head>

<body>

<div class="container">

<h1>Watch What You Want</h1>

<input id="searchBox" placeholder="Search movies..." />

<button onclick="search()">Search</button>

<div id="results" class="grid"></div>

</div>

<script>

const API_KEY = "b863c63714c639df3e613a7adbb57f34";

async function search() {

const query = document.getElementById("searchBox").value;

const res = await fetch(

`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${query}`

);

const data = await res.json();

const results = document.getElementById("results");

results.innerHTML = ""

data.results.forEach(movie => {

const poster = movie.poster_path

? "https://image.tmdb.org/t/p/w500" + movie.poster_path

: ""

results.innerHTML += `

<div class="card">

<img src="${poster}" />

<p>${movie.title}</p>

</div>

`;

});

}

</script>

</body>

</html>
