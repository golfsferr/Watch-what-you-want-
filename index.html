<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch What You Want</title>
<meta name="description" content="Find movies and TV shows to rent, buy, or stream.">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

.hero {
  text-align: center;
  padding: 45px 20px;
  background: radial-gradient(circle at top, #8b1118, #050505 65%);
}

h1 {
  font-size: clamp(38px, 8vw, 78px);
  margin: 0 0 10px;
}

.subtitle {
  color: #ddd;
}

input {
  padding: 16px;
  width: 60%;
  max-width: 500px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
}

button {
  padding: 16px 22px;
  border: none;
  border-radius: 30px;
  background: #e50914;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 22px;
  padding: 25px;
}

.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  background: #222;
}

.cardText {
  padding: 10px;
}

.cardText p {
  margin: 5px 0;
  color: #ccc;
  font-size: 14px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  padding: 25px;
  overflow: auto;
  z-index: 10;
}

.modalContent {
  max-width: 900px;
  margin: auto;
  background: #111;
  padding: 25px;
  border-radius: 16px;
}

.close {
  float: right;
  font-size: 30px;
  cursor: pointer;
}

.bigButton {
  display: block;
  margin: 15px 0;
  padding: 18px;
  background: #e50914;
  color: white;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border-radius: 999px;
  text-decoration: none;
}

.badge {
  display: inline-block;
  margin: 5px;
  padding: 8px 12px;
  background: #222;
  color: white;
  border-radius: 999px;
  text-decoration: none;
}

.modalGrid {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
}

.modalGrid img {
  width: 220px;
  border-radius: 12px;
  background: #222;
}

.modalInfo {
  flex: 1;
  min-width: 260px;
}

iframe {
  margin-top: 22px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Watch What You Want</h1>
  <p class="subtitle">Find movies and TV shows to rent, buy, or stream.</p>

  <input id="searchInput" placeholder="Search Batman, Top Gun, Imperfect Women..." onkeydown="if(event.key==='Enter') searchTitles()">
  <button onclick="searchTitles()">Search</button>
</div>

<div id="results" class="grid"></div>

<div id="modal" class="modal">
  <div class="modalContent">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API_KEY = "b863c63714c639df3e613a7adbb57f34";
const AMAZON_TAG = "justus1ktp-20";

function loadTrending() {
  fetch("https://api.themoviedb.org/3/trending/movie/week?api_key=" + API_KEY)
    .then(res => res.json())
    .then(data => showCards(data.results || []))
    .catch(() => {
      document.getElementById("results").innerHTML = "Could not load trending movies.";
    });
}

function searchTitles() {
  const query = document.getElementById("searchInput").value.trim();

  if (!query) {
    loadTrending();
    return;
  }

  document.getElementById("results").innerHTML = "Searching...";

  fetch("https://api.themoviedb.org/3/search/multi?api_key=" + API_KEY + "&query=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {
      const filtered = (data.results || []).filter(item =>
        item.media_type === "movie" || item.media_type === "tv"
      );

      showCards(filtered);
    })
    .catch(() => {
      document.getElementById("results").innerHTML = "Search failed.";
    });
}

function showCards(items) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  items.slice(0, 18).forEach(item => {
    const title = item.title || item.name || "Untitled";
    const amazonLink = "https://www.amazon.com/s?k=" + encodeURIComponent(title + " movie") + "&tag=" + AMAZON_TAG;
    const type = item.media_type || "movie";
    const date = item.release_date || item.first_air_date || "";
    const year = date ? date.substring(0, 4) : "Unknown";
    const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
    const poster = item.poster_path
      ? "https://image.tmdb.org/t/p/w500" + item.poster_path
      : "https://via.placeholder.com/300x450?text=No+Poster";

    results.innerHTML += `
      <div class="card" onclick="openDetails(${item.id}, '${type}')">
        <img src="${poster}">
        <div class="cardText">
          <strong>${title}</strong>
          <p>${year} • ⭐ ${rating}</p>
          <p>${type === "tv" ? "TV Show" : "Movie"}</p>
        </div>
      </div>
    `;
  });
}

function openDetails(id, type) {
  const modal = document.getElementById("modal");
  const body = document.getElementById("modalBody");

  modal.style.display = "block";
  body.innerHTML = "Loading...";

  const detailsUrl = "https://api.themoviedb.org/3/" + type + "/" + id + "?api_key=" + API_KEY;
  const providersUrl = "https://api.themoviedb.org/3/" + type + "/" + id + "/watch/providers?api_key=" + API_KEY;
  const videosUrl = "https://api.themoviedb.org/3/" + type + "/" + id + "/videos?api_key=" + API_KEY;

  Promise.all([
    fetch(detailsUrl).then(res => res.json()),
    fetch(providersUrl).then(res => res.json()),
    fetch(videosUrl).then(res => res.json())
  ])
  .then(([item, providersData, videosData]) => {
    const title = item.title || item.name || "Untitled";
    const date = item.release_date || item.first_air_date || "Unknown";
    const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
    const poster = item.poster_path
      ? "https://image.tmdb.org/t/p/w500" + item.poster_path
      : "https://via.placeholder.com/300x450?text=No+Poster";

    let providers = [];

    if (providersData.results && providersData.results.US) {
      const us = providersData.results.US;

      if (us.rent) providers = us.rent;
      else if (us.buy) providers = us.buy;
      else if (us.flatrate) providers = us.flatrate;
    }

    const amazonLink = "https://www.amazon.com/s?k=" + encodeURIComponent(title + " movie") + "&tag=" + AMAZON_TAG;

    const providerButtons = providers.length
      ? providers.map(p => {
          let link = "https://www.justwatch.com/us/search?q=" + encodeURIComponent(title);

          if (p.provider_name.includes("Amazon")) {
            link = amazonLink;
          }

          if (p.provider_name.includes("Apple")) {
            link = "https://tv.apple.com/search?term=" + encodeURIComponent(title);
          }

          if (p.provider_name.includes("Vudu")) {
            link = "https://www.vudu.com/content/movies/search?searchString=" + encodeURIComponent(title);
          }

          return `<a class="badge" href="${link}" target="_blank">${p.provider_name}</a>`;
        }).join("")
      : "<span class='badge'>No PPV or streaming info found</span>";

    const trailer = videosData.results
      ? videosData.results.find(v => v.site === "YouTube" && v.type === "Trailer")
      : null;

    const trailerHTML = trailer
      ? `<iframe width="100%" height="360" src="https://www.youtube.com/embed/${trailer.key}" frameborder="0" allowfullscreen></iframe>`
      : "";

    body.innerHTML = `
      <div class="modalGrid">
        <img src="${poster}">

        <div class="modalInfo">
          <h2>${title}</h2>
<a class="bigButton" href="${amazonLink}" target="_blank">
  🔥 Watch Now – Rent or Buy Instantly
</a>
<p style="color:#00ffcc;font-size:15px;margin-top:6px;font-weight:bold;">
  💲 Rent from ~$3.99
</p>





          

          <p style="color:#ff4d4d;font-weight:bold;">
            ⚡ PPV focused — no subscription required
          </p>

          <p style="color:#ccc;font-size:14px;">
            ✔ Rent or buy • ✔ Instant access • ✔ Watch anytime
          </p>

          <p><strong>Release:</strong> ${date}</p>
          <p style="color:#ffd700;"><strong>Rating:</strong> ⭐ ${rating} / 10</p>
          <p>${item.overview || "No description available."}</p>

          <p style="font-weight:bold;">Choose where to watch:</p>
          <div>${providerButtons}</div>

          <a class="badge" href="https://www.justwatch.com/us/search?q=${encodeURIComponent(title)}" target="_blank">
            More watch options
          </a>
        </div>
      </div>

      ${trailerHTML}
    `;
  })
  .catch(() => {
    body.innerHTML = "Could not load details.";
  });
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

loadTrending();
</script>

</body>
</html>
