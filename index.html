<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch What You Want</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#050505;
  color:white;
}

.hero {
  padding:40px;
  text-align:center;
  background:linear-gradient(#7b1113,#050505);
}

input {
  padding:15px;
  width:60%;
  max-width:400px;
  border-radius:30px;
  border:none;
}

button {
  padding:15px;
  border:none;
  border-radius:30px;
  background:#e50914;
  color:white;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:20px;
}

.card img {
  width:100%;
  border-radius:10px;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  padding:20px;
}

.modalContent {
  background:#111;
  padding:20px;
  border-radius:10px;
  max-width:800px;
  margin:auto;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Watch What You Want</h1>
  <input id="searchBox" placeholder="Search movies or shows">
  <button onclick="search()">Search</button>
</div>

<div id="results" class="grid"></div>

<div id="modal" class="modal">
  <div class="modalContent">
    <button onclick="closeModal()">Close</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const API_KEY = "b863c63714c639df3e613a7adbb57f34";

function loadTrending() {
  fetch("https://api.themoviedb.org/3/trending/movie/week?api_key=" + API_KEY)
    .then(res => res.json())
    .then(data => show(data.results));
}

function search() {
  const q = document.getElementById("searchBox").value;

  fetch("https://api.themoviedb.org/3/search/multi?api_key=" + API_KEY + "&query=" + q)
    .then(res => res.json())
    .then(data => {
      const filtered = data.results.filter(x => x.media_type === "movie" || x.media_type === "tv");
      show(filtered);
    });
}

function show(list) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  list.forEach(item => {
    const poster = item.poster_path
      ? "https://image.tmdb.org/t/p/w500" + item.poster_path
      : "";

    const title = item.title || item.name;

    results.innerHTML += `
      <div class="card" onclick="openDetails(${item.id}, '${item.media_type}')">
        <img src="${poster}">
        <p>${title}</p>
      </div>
    `;
  });
}

function openDetails(id, type) {
  const modal = document.getElementById("modal");
  const body = document.getElementById("modalBody");

  modal.style.display = "block";
  body.innerHTML = "Loading...";

  fetch("https://api.themoviedb.org/3/" + type + "/" + id + "?api_key=" + API_KEY)
    .then(res => res.json())
    .then(item => {

      const title = item.title || item.name || "Untitled";
const date = item.release_date || item.first_air_date || "Unknown";
      const poster = item.poster_path
        ? "https://image.tmdb.org/t/p/w500" + item.poster_path
        : "";

      body.innerHTML = `
        <h2>${title}</h2>
        <p><strong>Release:</strong> ${item.release_date || item.first_air_date || "Unknown"}</p>
        <img src="${poster}" style="width:200px">
        <p>${item.overview || ""}</p>

        <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(title)}"
           target="_blank"
           style="display:inline-block;margin-top:10px;background:red;padding:10px;color:white;">
           Where to Watch
        </a>
      `;
    })
    .catch(() => {
      body.innerHTML = "Error loading details.";
    });
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

loadTrending();

</script>

</body>
</html>
