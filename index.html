<!DOCTYPE html>

<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch What You Want</title>

<style>

body {

margin: 0;

font-family: Arial;

background: #050505;

color: white;

text-align: center;

}

.container {

padding: 40px 20px;

max-width: 1000px;

margin: auto;

}

h1 {

font-size: 48px;

}

input {

padding: 15px;

width: 60%;

max-width: 400px;

border-radius: 30px;

border: none;

font-size: 16px;

}

button {

padding: 15px 25px;

border: none;

border-radius: 30px;

background: #e50914;

color: white;

font-size: 16px;

margin-left: 10px;

cursor: pointer;

}

.grid {

margin-top: 40px;

display: grid;

grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

gap: 20px;

}

.card img {

width: 100%;

border-radius: 10px;

}

.card p {

font-size: 14px;

}

</style>

</head>

<body>

<div class="container">

<h1>Watch What You Want</h1>

<input id="searchBox" placeholder="Search movies..." />

<button onclick="search()">Search</button>

<div id="results" class="grid"></div>

</div>

<script>

const API_KEY = "b863c63714c639df3e613a7adbb57f34"

async function search() {

const query = document.getElementById("searchBox").value.trim();

const resultsDiv = document.getElementById("results");

if (!query) {

resultsDiv.innerHTML = "Type a movie name first."

return;

}

resultsDiv.innerHTML = "Loading..."

try {

const res = await fetch(

`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`

);

const data = await res.json();

resultsDiv.innerHTML = ""
for (const movie of data.results.slice(0, 8)) {

  const poster = movie.poster_path
    ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
    : "";

  const providerRes = await fetch(
    `https://api.themoviedb.org/3/movie/${movie.id}/watch/providers?api_key=${API_KEY}`
  );

  const providerData = await providerRes.json();

  let providers = [];

  if (providerData.results && providerData.results.US) {
    const us = providerData.results.US;

    if (us.flatrate) {
      providers = us.flatrate.map(p => p.provider_name);
    } else if (us.rent) {
      providers = us.rent.map(p => p.provider_name);
    } else if (us.buy) {
      providers = us.buy.map(p => p.provider_name);
    }
  }

  const providerText = providers.length
    ? providers.slice(0, 3).join(", ")
    : "No streaming info";

  const watchLink =
    providerData.results && providerData.results.US && providerData.results.US.link
      ? providerData.results.US.link
      : `https://www.themoviedb.org/movie/${movie.id}`;

  resultsDiv.innerHTML += `
    <a href="${watchLink}" target="_blank" class="card" style="text-decoration:none;color:white;">
      <img src="${poster}" />
      <p><strong>${movie.title}</strong></p>
      <p style="font-size:12px;color:#ccc;">${providerText}</p>
    </a>
  `;
}
for (const movie of data.results.slice(0, 8)) {

const poster = movie.poster_path

? "https://image.tmdb.org/t/p/w500" + movie.poster_path

: ""

// 🔥 get providers

const providerRes = await fetch(

`https://api.themoviedb.org/3/movie/${movie.id}/watch/providers?api_key=${API_KEY}`

);

const providerData = await providerRes.json();

let providers = [];

if (providerData.results && providerData.results.US) {

const us = providerData.results.US;

if (us.flatrate) {

providers = us.flatrate.map(p => p.provider_name);

} else if (us.rent) {

providers = us.rent.map(p => p.provider_name);

} else if (us.buy) {

providers = us.buy.map(p => p.provider_name);

}

}

const providerText = providers.length

? providers.slice(0, 3).join(", ")

: "No streaming info";

resultsDiv.innerHTML += `

<div class="card">

<img src="${poster}" />

<p><strong>${movie.title}</strong></p>

<p style="font-size:12px;color:#ccc;">${providerText}</p>

</div>

`;

}

} catch (error) {

resultsDiv.innerHTML = "Something went wrong."

console.error(error);

}

}

</script>

</body>

</html>
