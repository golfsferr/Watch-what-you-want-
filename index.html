<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch What You Want</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#050505; color:white; }
.hero { padding:40px 20px; text-align:center; background:radial-gradient(circle at top,#7b1113,#050505 60%); }
h1 { font-size:clamp(38px,8vw,78px); }
input { padding:16px 20px; width:60%; max-width:480px; border-radius:30px; border:none; font-size:16px; }
button { padding:16px 25px; border:none; border-radius:30px; background:#e50914; color:white; font-size:16px; font-weight:bold; cursor:pointer; }
.section { max-width:1250px; margin:auto; padding:25px 20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:24px; }
.card { background:#111; border-radius:14px; overflow:hidden; cursor:pointer; }
.card img { width:100%; height:285px; object-fit:cover; background:#222; }
.cardText { padding:12px; }
.cardText p { color:#ccc; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); padding:30px; overflow:auto; }
.modalContent { max-width:850px; margin:auto; background:#111; padding:25px; border-radius:18px; }
.close { float:right; font-size:32px; cursor:pointer; }
</style>
</head>

<body>

<div class="hero">
  <h1>Watch What You Want</h1>
  <p>Search movies and TV shows. See ratings, details, and where to watch.</p>
  <input id="searchBox" placeholder="Search Batman, Imperfect Women, Top Gun..." />
  <button onclick="searchTitles()">Search</button>
</div>

<div class="section">
  <h2 id="sectionTitle">Trending Movies</h2>
  <div id="results" class="grid"></div>
</div>

<div id="movieModal" class="modal">
  <div class="modalContent">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API_KEY = "b863c63714c639df3e613a7adbb57f34";

function loadTrending() {
  document.getElementById("sectionTitle").innerText = "Trending Movies";
  document.getElementById("results").innerHTML = "Loading...";

  fetch("https://api.themoviedb.org/3/trending/movie/week?api_key=" + API_KEY)
    .then(response => response.json())
    .then(data => {
      showCards(data.results.slice(0, 12));
    })
    .catch(error => {
      console.log(error);
      document.getElementById("results").innerHTML = "Could not load trending movies.";
    });
}

function searchTitles() {
  const query = document.getElementById("searchBox").value.trim();

  if (!query) {
    loadTrending();
    return;
  }

  document.getElementById("sectionTitle").innerText = "Search Results: " + query;
  document.getElementById("results").innerHTML = "Searching...";

  fetch("https://api.themoviedb.org/3/search/multi?api_key=" + API_KEY + "&query=" + encodeURIComponent(query))
    .then(response => response.json())
    .then(data => {
      const filtered = data.results.filter(item => item.media_type === "movie" || item.media_type === "tv");
      showCards(filtered.slice(0, 12));
    })
    .catch(error => {
      console.log(error);
      document.getElementById("results").innerHTML = "Search failed.";
    });
}

function showCards(items) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  items.forEach(item => {
    const title = item.title || item.name || "Untitled";
    const type = item.media_type || "movie";
    const date = item.release_date || item.first_air_date || "";
    const year = date ? date.substring(0, 4) : "Unknown";
    const poster = item.poster_path ? "https://image.tmdb.org/t/p/w500" + item.poster_path : "";

    results.innerHTML += `
      <div class="card" onclick="openDetails(${item.id}, '${type}')">
        <img src="${poster}">
        <div class="cardText">
          <strong>${title}</strong>
          <p>${year} • ${type === "tv" ? "TV Show" : "Movie"}</p>
        </div>
      </div>
    `;
  });
}

function openDetails(id, type) {
  const modal = document.getElementById("movieModal");
  const modalBody = document.getElementById("modalBody");

  modal.style.display = "block";
  modalBody.innerHTML = "Loading...";

  fetch("https://api.themoviedb.org/3/" + type + "/" + id + "?api_key=" + API_KEY)
    .then(response => response.json())
    .then(item => {
      const title = item.title || item.name || "Untitled";
      const date = item.release_date || item.first_air_date || "Unknown";
      const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";

    const poster = item.poster_path
  ? "https://image.tmdb.org/t/p/w500" + item.poster_path
  : "https://via.placeholder.com/220x330?text=No+Poster";

modalBody.innerHTML = `
  <div style="display:flex;gap:20px;flex-wrap:wrap;">
    
    <img src="${poster}" style="width:220px;border-radius:12px;background:#222;">
    
    <div style="flex:1;min-width:250px;">
      <h2>${title}</h2>
      <p><strong>Release:</strong> ${date}</p>
      <p><strong>Rating:</strong> ⭐ ${rating}</p>
      <p>${item.overview || "No description available."}</p>

      <a href="https://www.google.com/search?q=watch+${encodeURIComponent(title)}"
         target="_blank"
         style="color:white;background:#e50914;padding:12px 18px;border-radius:999px;text-decoration:none;">
         Where to Watch
      </a>

    </div>

  </div>
`;
    })
    .catch(error => {
      console.log(error);
      modalBody.innerHTML = "Could not load details.";
    });
}

function closeModal() {
  document.getElementById("movieModal").style.display = "none";
}

loadTrending();
</script>

</body>
</html>
