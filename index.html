<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch What You Want</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050505;
  color: white;
}

.hero {
  padding: 35px 20px;
  text-align: center;
  background: radial-gradient(circle at top, #7b1113, #050505 60%);
}

h1 {
  font-size: clamp(38px, 8vw, 78px);
  margin-bottom: 10px;
}

.subtitle {
  color: #ddd;
  font-size: 18px;
}

.searchArea {
  margin: 30px auto;
}

input {
  padding: 16px 20px;
  width: 60%;
  max-width: 480px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
}

button {
  padding: 16px 25px;
  border: none;
  border-radius: 30px;
  background: #e50914;
  color: white;
  font-size: 16px;
  margin-left: 10px;
  cursor: pointer;
  font-weight: bold;
}

.section {
  max-width: 1250px;
  margin: auto;
  padding: 25px 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 24px;
}

.card {
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s ease, box-shadow .25s ease;
}

.card:hover {
  transform: scale(1.06);
  box-shadow: 0 15px 40px rgba(0,0,0,.75);
}

.card img {
  width: 100%;
  height: 285px;
  object-fit: cover;
  background: #222;
}

.cardText {
  padding: 12px;
}

.cardText strong {
  display: block;
  min-height: 38px;
}

.cardText p {
  margin: 6px 0;
  color: #ccc;
  font-size: 14px;
}

.badge {
  background: #242424;
  color: white;
  padding: 6px 10px;
  border-radius: 999px;
  display: inline-block;
  font-size: 12px;
  margin: 4px 4px 0 0;
}

.modal {
  display: none;
  position: fixed;
  z-index: 10;
  inset: 0;
  background: rgba(0,0,0,.88);
  padding: 30px;
  overflow-y: auto;
}

.modalContent {
  max-width: 900px;
  margin: auto;
  background: #111;
  border-radius: 18px;
  padding: 25px;
}

.close {
  float: right;
  font-size: 32px;
  cursor: pointer;
}

.modalTop {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
}

.modalTop img {
  width: 250px;
  border-radius: 12px;
  background: #222;
}

.modalInfo {
  flex: 1;
  min-width: 260px;
}

.actionLink {
  display: inline-block;
  margin-top: 14px;
  margin-right: 10px;
  padding: 12px 18px;
  background: #e50914;
  color: white;
  text-decoration: none;
  border-radius: 999px;
  font-weight: bold;
}

.secondary {
  background: #333;
}

.footerNote {
  color: #aaa;
  text-align: center;
  font-size: 12px;
  padding: 30px;
}

@media (max-width: 650px) {
  input {
    width: 100%;
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    margin-left: 0;
  }

  .modalTop img {
    width: 100%;
  }
}
</style>
</head>

<body onload="loadTrending()">

<div class="hero">
  <h1>Watch What You Want</h1>
  <p class="subtitle">Search movies and TV shows. See ratings, trailers, and where to watch.</p>

  <div class="searchArea">
    <input id="searchBox" placeholder="Search Batman, Imperfect Women, Top Gun..." onkeydown="if(event.key==='Enter') searchMovies()" />
    <button onclick="searchMovies()">Search</button>
  </div>
</div>

<div class="section">
  <h2 id="sectionTitle">Trending Movies</h2>
  <div id="results" class="grid"></div>
</div>

<div id="movieModal" class="modal">
  <div class="modalContent">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<p class="footerNote">Movie and TV data powered by TMDb. Streaming availability may vary by region.</p>

<script>
<script>
const API_KEY = "b863c63714c639df3e613a7adbb57f34";

async function loadTrending() {
  const resultsDiv = document.getElementById("results");
  const sectionTitle = document.getElementById("sectionTitle");

  sectionTitle.innerText = "Trending Movies";
  resultsDiv.innerHTML = "Loading...";

  try {
    const res = await fetch(
      `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}`
    );
    const data = await res.json();

    renderResults(data.results.slice(0, 12));
  } catch (err) {
    console.error(err);
    resultsDiv.innerHTML = "Error loading trending.";
  }
}

async function searchMovies() {
  const query = document.getElementById("searchBox").value.trim();
  const resultsDiv = document.getElementById("results");
  const sectionTitle = document.getElementById("sectionTitle");

  if (!query) {
    loadTrending();
    return;
  }

  sectionTitle.innerText = `Search: ${query}`;
  resultsDiv.innerHTML = "Searching...";

  try {
    const res = await fetch(
      `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`
    );

    const data = await res.json();

    const filtered = data.results.filter(item =>
      item.media_type === "movie" || item.media_type === "tv"
    );

    renderResults(filtered.slice(0, 12));
  } catch (err) {
    console.error(err);
    resultsDiv.innerHTML = "Search failed.";
  }
}

function renderResults(items) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  items.forEach(item => {
    const poster = item.poster_path
      ? "https://image.tmdb.org/t/p/w500" + item.poster_path
      : "";

    const title = item.title || item.name || "No title";
    const date = item.release_date || item.first_air_date;
    const year = date ? date.substring(0, 4) : "Unknown";

    resultsDiv.innerHTML += `
      <div class="card" onclick="openDetails(${item.id}, '${item.media_type}')">
        <img src="${poster}" />
        <div class="cardText">
          <strong>${title}</strong>
          <p>${year}</p>
        </div>
      </div>
    `;
  });
}

async function openDetails(id, type) {
  const modal = document.getElementById("movieModal");
  const modalBody = document.getElementById("modalBody");

  modal.style.display = "block";
  modalBody.innerHTML = "Loading...";

  try {
    const res = await fetch(
      `https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`
    );

    const data = await res.json();

    modalBody.innerHTML = `
      <h2>${data.title || data.name}</h2>
      <p>${data.overview || "No description"}</p>
    `;
  } catch (err) {
    console.error(err);
    modalBody.innerHTML = "Error loading details.";
  }
}

function closeModal() {
  document.getElementById("movieModal").style.display = "none";
}
</script>
</script>

</body>
</html>
